name: Update Site Data

# Refreshes Scholar/ORCID data and rebuilds index.html from template.
on:
  # Run every Sunday at 6am UTC
  schedule:
    - cron: '0 6 * * 0'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data and rebuild site
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python build.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git commit -m "Auto-update: refresh Scholar & ORCID data

          Updated citations, h-index, and publication list from live sources."
          git push
